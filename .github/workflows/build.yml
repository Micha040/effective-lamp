# Bei jedem Push und Pull Request: testen, alles bauen, Pakete schnüren (als Artefakt zum Herunterladen).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push ersetzt einen noch laufenden (oder hängenden) Lauf desselben Zweigs
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testen und bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: MinGW-w64 installieren
        timeout-minutes: 15
        run: |
          # Paketquellen hängen gelegentlich: kurze Zeitlimits, bis zu drei Versuche
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            if timeout 240 $APT update && timeout 400 $APT install -y --no-install-recommends \
                 g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64; then
              break
            fi
            [ "$try" = 3 ] && exit 1
            echo "Versuch $try fehlgeschlagen – neuer Versuch in 20 s"; sleep 20
          done
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Go einrichten (für fdanalyze von FragDesk)
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      # Node.js (vorinstalliert auf dem Runner): Helfer fragdesk-fetch für „Demos automatisch laden“ (npm ci, esbuild)
      - name: Node.js prüfen
        run: |
          node --version && npm --version
          [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 18 ] || { echo "::error::fragdesk-fetch braucht Node.js 18 oder neuer"; exit 1; }

      - name: Tests (Linux)
        run: |
          sh launcher/tests/run.sh
          sh apps/deskcats/tests/run.sh
          sh apps/snowdesk/tests/run.sh
          sh apps/fragdesk/tests/run.sh   # auch fragdesk-server: Einzelteile, ganzer Ablauf über HTTP, install.sh
          pwsh -NoProfile -File apps/fragdesk/tools/ps_check.ps1 -SetupPath apps/fragdesk/setup/Setup.ps1

      - name: Bauen (Windows-Programme, Launcher, fragdesk-server, fdanalyze für Linux, fragdesk-fetch)
        run: sh tools/build-all.sh

      - name: Tests (Analyzer von FragDesk)
        working-directory: apps/fragdesk/analyzer
        run: |
          go vet ./...
          go test ./...

      - name: Pakete schnüren
        run: |
          python3 tools/package.py --tag "dev-${GITHUB_SHA::7}"
          sh launcher/tests/run.sh "$PWD/dist/catalog.json"
          # fragdesk-server und für „Demos automatisch laden“ fdanalyze und fragdesk-fetch liegen bei (install.sh lädt sie
          # samt Prüfsumme aus dem Release)
          (cd dist && grep -E ' (fragdesk-server|fdanalyze)-linux-x64$' SHA256SUMS.txt | sha256sum -c - && ./fragdesk-server-linux-x64 version && ./fdanalyze-linux-x64 -version)
          if [ -f dist/fragdesk-fetch.js ]; then
            (cd dist && grep -E ' fragdesk-fetch(\.js|-NOTICES\.txt)$' SHA256SUMS.txt | sha256sum -c - && node fragdesk-fetch.js version)
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: efficient-lamp-${{ github.sha }}
          path: dist/
          retention-days: 14
