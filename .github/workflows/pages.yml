# STAMMTISCH veröffentlichen: stellt apps/stammtisch/web als Webseite bereit (GitHub Pages).
# Adresse: https://micha040.github.io/effective-lamp/stammtisch/
# Läuft bei jedem Push auf main, der die App ändert – erst die Tests, dann die Veröffentlichung.
# Einmalig nötig: im Repo unter Settings › Pages › Source „GitHub Actions“ wählen.
# Mit den Releases von efficient lamp (release.yml, Launcher) hat das nichts zu tun.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/stammtisch/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig; eine laufende wird zu Ende gebracht
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Testen und veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}stammtisch/
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        run: sh apps/stammtisch/tests/run.sh

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp .github/pages/index.html _site/index.html
          cp -r apps/stammtisch/web _site/stammtisch
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
