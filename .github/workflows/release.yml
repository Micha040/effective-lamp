# Neuer Tag vX.Y.Z -> testen, bauen, Pakete + catalog.json erzeugen und als GitHub-Release veröffentlichen.
# Der Launcher liest catalog.json aus dem jeweils neuesten Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, z. B. v1.0.1'
        required: true

permissions:
  contents: write

# Releases nie abbrechen, aber auch nie zwei für denselben Tag gleichzeitig
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: MinGW-w64 installieren
        timeout-minutes: 15
        run: |
          # Paketquellen hängen gelegentlich: kurze Zeitlimits, bis zu drei Versuche
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            if timeout 240 $APT update && timeout 400 $APT install -y --no-install-recommends \
                 g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64; then
              break
            fi
            [ "$try" = 3 ] && exit 1
            echo "Versuch $try fehlgeschlagen – neuer Versuch in 20 s"; sleep 20
          done
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Tests (Linux)
        run: |
          sh launcher/tests/run.sh
          sh apps/deskcats/tests/run.sh
          sh apps/snowdesk/tests/run.sh

      - name: Bauen
        run: sh tools/build-all.sh

      - name: Pakete und catalog.json
        run: |
          python3 tools/package.py --tag "$TAG" --notes release-notes.md
          sh launcher/tests/run.sh "$PWD/dist/catalog.json"

      - name: Auf GitHub veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "efficient lamp ${TAG#v}" --notes-file release-notes.md --latest
          fi
