# Release veröffentlichen: per Tag-Push (vX.Y.Z) oder von Hand über "Run workflow".
# Testet, baut, erzeugt Pakete + catalog.json und veröffentlicht alles als GitHub-Release.
# Der Launcher liest catalog.json aus dem jeweils neuesten Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # "Actions › Release › Run workflow": legt den Tag selbst an
    inputs:
      tag:
        description: 'Versionsnummer, z. B. v1.2.0 – leer lassen = nächste Version (letzte + 0.0.1)'
        required: false
        default: ''

permissions:
  contents: write

# Releases nie abbrechen, aber auch nie zwei gleichzeitig für denselben Tag (oder ohne Tag-Angabe)
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # mit Tags

      # Legt TAG und TARGET für alle weiteren Schritte fest. Von Hand gestartet: Ein vorhandener Tag wird nur gebaut,
      # wenn er auf genau diesen Stand zeigt – sonst liefen die Schritte von heute mit dem Code von damals.
      - name: Stand festlegen
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          NEXT=v1.0.0
          if [ -n "$LAST" ]; then IFS=. read -r MA MI PA <<< "${LAST#v}"; NEXT="v$MA.$MI.$((PA + 1))"; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG=$(echo "$TAG_INPUT" | tr -d '[:space:]')
            if [ -z "$TAG" ]; then TAG=$NEXT; echo "Keine Versionsnummer angegeben – nehme $TAG (letzte: ${LAST:-keine})"; fi
          else
            TAG=$REF_NAME
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Versionsnummer muss wie v1.2.3 aussehen (war: $TAG)"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            AT=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$AT" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG gibt es schon (älterer Stand ${AT::7}). Für ein neues Release eine neue Nummer eintragen, z. B. $NEXT – oder das Feld einfach leer lassen."
              exit 1
            fi
            git checkout -q "refs/tags/$TAG"
            echo "TARGET=$AT" >> "$GITHUB_ENV"
            echo "Release aus vorhandenem Tag $TAG (${AT::7})"
          else
            echo "TARGET=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "Tag $TAG gibt es noch nicht – er wird beim Veröffentlichen auf ${GITHUB_SHA::7} angelegt"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: MinGW-w64 installieren
        timeout-minutes: 15
        run: |
          # Paketquellen hängen gelegentlich: kurze Zeitlimits, bis zu drei Versuche
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            if timeout 240 $APT update && timeout 400 $APT install -y --no-install-recommends \
                 g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64; then
              break
            fi
            [ "$try" = 3 ] && exit 1
            echo "Versuch $try fehlgeschlagen – neuer Versuch in 20 s"; sleep 20
          done
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Go einrichten (für fdanalyze von FragDesk)
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Tests (Linux)
        run: |
          sh launcher/tests/run.sh
          sh apps/deskcats/tests/run.sh
          sh apps/snowdesk/tests/run.sh
          sh apps/fragdesk/tests/run.sh   # auch fragdesk-server: Einzelteile, ganzer Ablauf über HTTP, install.sh
          pwsh -NoProfile -File apps/fragdesk/tools/ps_check.ps1 -SetupPath apps/fragdesk/setup/Setup.ps1

      - name: Bauen (Windows-Programme, Launcher, fragdesk-server)
        run: sh tools/build-all.sh

      - name: Tests (Analyzer von FragDesk)
        working-directory: apps/fragdesk/analyzer
        run: |
          go vet ./...
          go test ./...

      - name: Pakete und catalog.json
        run: |
          python3 tools/package.py --tag "$TAG" --notes release-notes.md
          sh launcher/tests/run.sh "$PWD/dist/catalog.json"
          # fragdesk-server: install.sh lädt releases/latest/download/fragdesk-server-linux-x64 und prüft SHA256SUMS.txt
          (cd dist && grep ' fragdesk-server-linux-x64$' SHA256SUMS.txt | sha256sum -c - && ./fragdesk-server-linux-x64 version)

      - name: Auf GitHub veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # z. B. auf der Release-Seite angelegt: Dateien (neu) hochladen, leere Beschreibung füllen
            gh release upload "$TAG" dist/* --clobber
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then gh release edit "$TAG" --notes-file release-notes.md; fi
          else
            gh release create "$TAG" dist/* --target "$TARGET" --title "efficient lamp ${TAG#v}" --notes-file release-notes.md --latest
          fi
