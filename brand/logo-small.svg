  <path d="M9.6 18.4 A9 9 0 1 1 22.4 18.4 C21.3 19.5 20.6 20.6 20.6 22 L11.4 22 C11.4 20.6 10.7 19.5 9.6 18.4 Z" fill="url(#glass)"/>
