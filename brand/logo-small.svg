      <stop offset="0" stop-color="#26344D"/>
      <stop offset="1" stop-color="#0D1320"/>
    </linearGradient>
    <radialGradient id="glow" cx="16" cy="12.5" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB23E" stop-opacity="0.6"/>
